<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── SEO Meta Tags ──────────────────────────────────────── -->
    <title>Dream Weave Embroidery — Premium Aari Work & Goldwork in Tamil Nadu</title>
    <meta name="description" content="Dream Weave crafts heirloom-quality Aari work, zari embroidery, and bridal goldwork. Based in Tamil Nadu, India. Explore our portfolio and get a free quote today." />
    <meta name="keywords" content="Aari work, embroidery, bridal embroidery, zari work, goldwork, Tamil Nadu embroidery, blouse work, Dream Weave" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://dreamweave.in" />

    <!-- ── Open Graph / Social ───────────────────────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://dreamweave.in" />
    <meta property="og:title"       content="Dream Weave — Premium Aari Embroidery" />
    <meta property="og:description" content="Handcrafted Aari work and intricate embroidery that transforms fabric into heirloom art. Every stitch tells a story." />
    <meta property="og:image"       content="/logo.png" />
    <meta property="og:locale"      content="en_IN" />

    <!-- ── Twitter Card ──────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Dream Weave — Premium Aari Embroidery" />
    <meta name="twitter:description" content="Handcrafted Aari work and intricate embroidery that transforms fabric into heirloom art." />
    <meta name="twitter:image"       content="/logo.png" />

    <!-- ── Favicon ───────────────────────────────────────────── -->
    <link rel="icon"             href="/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- ── Performance hints ─────────────────────────────────── -->
    <!-- Preconnect for Google Fonts (loaded in CSS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preconnect for Cloudinary CDN -->
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <!-- Preconnect for Behold Instagram widget CDN -->
    <link rel="preconnect" href="https://w.behold.so" />

    <!-- Structured data (Local Business) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Dream Weave Embroidery",
      "description": "Premium Aari work and embroidery services in Tamil Nadu, India.",
      "url": "https://dreamweave.in",
      "logo": "https://dreamweave.in/logo.png",
      "address": {
        "@type": "PostalAddress",
        "addressRegion": "Tamil Nadu",
        "addressCountry": "IN"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": ["English", "Tamil"]
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Behold Instagram feed widget — non-blocking module script -->
    <script src="https://w.behold.so/widget.js" type="module"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
